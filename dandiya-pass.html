<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruthuragalu Dandiya Night Pass Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#f4dfcf;font-family:Arial,sans-serif;color:#4a2029}.wrap{max-width:520px;margin:auto;padding:16px}.panel{background:#fff9ef;border:1px solid #d9b875;border-radius:18px;padding:16px;box-shadow:0 12px 30px #5b182c22}h1{text-align:center;margin:0;color:#8b1739;font:900 27px Georgia}p{text-align:center;color:#76515a;font-size:12px;margin:7px 0 14px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input{width:100%;padding:12px;border:1px solid #d6b77f;border-radius:10px;font-size:16px;background:#fffdf8}.row{display:grid;grid-template-columns:1fr 110px;gap:10px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:13px;font-weight:900;font-size:14px}.gen{background:#8b1739;color:white}.share{background:#ead3a4;color:#5a1b2d}.stage{margin-top:18px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 10px 30px #5b182c22}canvas{display:block;width:100%;height:auto;border-radius:8px}.note{text-align:center;font-size:11px;color:#80646a;margin-top:8px}</style></head><body><div class="wrap"><div class="panel"><h1>Dandiya Night Pass Generator</h1><p>Enter the booking details and generate the same pass design shown below.</p><label>Booking Person Name</label><input id="name" placeholder="Enter booking name"><div class="row"><div><label>No. of People</label><input id="people" type="number" min="1" max="99" value="1"></div><div><label>Pass No.</label><input id="passno" readonly></div></div><button class="gen" id="generate">GENERATE PASS</button><button class="share" id="share">SAVE / SHARE TO WHATSAPP</button><div class="stage"><canvas id="pass" width="768" height="1152"></canvas></div><div class="note">The downloaded/shared image is generated from this exact canvas.</div></div></div><script>const W=768,H=1152,canvas=document.getElementById('pass'),ctx=canvas.getContext('2d'),img=new Image();img.crossOrigin='anonymous';img.src='https://raw.githubusercontent.com/ruthuragaluculturalclub/Ruthuragalu-Jamming-Session/main/dandiya-template.jpg?v=1';const nameEl=document.getElementById('name'),peopleEl=document.getElementById('people'),passNoEl=document.getElementById('passno');let counter=Number(localStorage.getItem('ruth_dn_counter')||0),current='';function nextId(){counter++;localStorage.setItem('ruth_dn_counter',counter);return 'DN-'+String(counter).padStart(4,'0')}function fitText(t,w,f){ctx.font=f;if(ctx.measureText(t).width<=w)return t;let s=t;while(s.length&&ctx.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}function draw(){if(!img.complete)return;ctx.clearRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);let name=(nameEl.value.trim()||'YOUR NAME').toUpperCase(),people=Math.max(1,Math.min(99,Number(peopleEl.value)||1)),pid=current||'DN-0001';ctx.fillStyle='#8b1739';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 28px Georgia';ctx.fillText(fitText(name,300,'bold 28px Georgia'),270,430);ctx.fillText(people+(people===1?' PERSON':' PEOPLE'),610,430);ctx.font='bold 25px Georgia';ctx.fillText('PASS ID: '+pid,384,505)}img.onload=draw;nameEl.oninput=draw;peopleEl.oninput=draw;document.getElementById('generate').onclick=()=>{current=nextId();passNoEl.value=current;draw()};document.getElementById('share').onclick=async()=>{if(!current){current=nextId();passNoEl.value=current;draw()}await new Promise(r=>setTimeout(r,100));canvas.toBlob(async blob=>{const file=new File([blob],'Ruthuragalu-Dandiya-'+current+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Ruthuragalu Dandiya Night Entry Pass',files:[file]});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};</script></body></html>
