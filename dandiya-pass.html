<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruthuragalu Dandiya Night Entry Pass</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2dfd0;font-family:Arial,sans-serif;color:#351c23}
.wrap{max-width:560px;margin:auto;padding:16px}.panel{background:#fffaf1;border:1px solid #d6b77f;border-radius:18px;padding:16px;box-shadow:0 12px 35px #5b182c22}
h1{margin:0;text-align:center;color:#8b1739;font:800 27px Georgia}.sub{text-align:center;font-size:11px;letter-spacing:1.4px;color:#76525a;margin:5px 0 15px}
label{display:block;font-size:13px;font-weight:800;color:#64263a;margin:10px 0 5px}input{width:100%;padding:12px;border:1px solid #d4b176;border-radius:10px;background:#fffdf8;font-size:16px}
.row{display:grid;grid-template-columns:1fr 130px;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
button{padding:13px;border:0;border-radius:10px;font-weight:900;font-size:14px}.primary{background:#8b1739;color:#fff}.secondary{background:#e8d0a1;color:#5b1b2d}
.note{text-align:center;color:#76525a;font-size:11px;margin:10px 0 14px}#preview{width:100%;display:block}
@media(max-width:430px){.row,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<h1>Ruthuragalu Dandiya Pass Generator</h1>
<div class="sub">ENTER DETAILS • GENERATE PASS • SHARE ON WHATSAPP</div>
<label>Booking Person Name</label><input id="name" placeholder="Enter booking name" autocomplete="off">
<div class="row"><div><label>No. of People</label><input id="people" type="number" min="1" max="99" value="1"></div>
<div><label>Pass ID</label><input id="passNo" readonly></div></div>
<div class="actions"><button class="primary" id="generate">GENERATE PASS</button><button class="secondary" id="save">SAVE / SHARE</button></div>
<div class="note">The preview and saved/WhatsApp pass are generated from the SAME template.</div>
<img id="preview" alt="Dandiya entry pass">
</div></div>
<script>
const template=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff5df"/><stop offset=".55" stop-color="#f8dfcf"/><stop offset="1" stop-color="#f2c8d0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0b866"/><stop offset="1" stop-color="#a9792e"/></linearGradient></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect x="20" y="20" width="984" height="1496" rx="4" fill="none" stroke="url(#gold)" stroke-width="10"/><rect x="38" y="38" width="948" height="1460" fill="none" stroke="#8b1739" stroke-width="2"/><g opacity=".9" font-family="Georgia" font-size="32" fill="#8b1739"><text x="52" y="70">✿</text><text x="930" y="70">✿</text><text x="55" y="1460">✿</text><text x="925" y="1460">✿</text></g><text x="512" y="125" text-anchor="middle" font-size="66" font-weight="900" fill="#111" font-family="serif">బృందరాగాలు</text><line x1="300" y1="158" x2="420" y2="158" stroke="#111" stroke-width="3"/><circle cx="430" cy="158" r="5" fill="#111"/><line x1="604" y1="158" x2="724" y2="158" stroke="#111" stroke-width="3"/><circle cx="594" cy="158" r="5" fill="#111"/><text x="512" y="205" text-anchor="middle" font-size="38" font-weight="800" letter-spacing="5" fill="#111" font-family="Georgia">RUTHURAGALU</text><text x="512" y="235" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="4" fill="#111" font-family="Arial">A TELUGU CULTURAL CLUB</text><path d="M145 285 Q512 220 879 285 L900 550 Q512 610 124 550 Z" fill="#8b1739"/><text x="512" y="390" text-anchor="middle" font-size="94" font-weight="900" fill="#f7dfa0" font-family="Georgia">DANDIYA</text><text x="512" y="480" text-anchor="middle" font-size="94" font-weight="900" fill="#f7dfa0" font-family="Georgia">NIGHT</text><rect x="310" y="500" width="404" height="78" rx="39" fill="#fff1cc" stroke="#c99b45" stroke-width="5"/><text x="512" y="552" text-anchor="middle" font-size="38" font-weight="900" fill="#4a2029" font-family="Georgia">ENTRY PASS</text><path d="M220 635 Q512 590 804 635 L820 720 Q512 765 204 720 Z" fill="#8b1739"/><text x="512" y="690" text-anchor="middle" font-size="37" font-weight="800" fill="white" font-family="Georgia">BOOKING CONFIRMED ♥</text><rect x="75" y="755" width="874" height="550" rx="28" fill="#fffdf8" stroke="#d6b77f" stroke-width="3"/><text x="300" y="835" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="1.5" fill="#79515a" font-family="Arial">BOOKING NAME</text><text id="bookingName" x="300" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">YOUR NAME</text><text x="735" y="835" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="1.5" fill="#79515a" font-family="Arial">NO. OF PEOPLE</text><text id="people" x="735" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">1</text><line x1="145" y1="935" x2="879" y2="935" stroke="#d6b77f" stroke-width="2"/><text x="512" y="990" text-anchor="middle" font-size="23" font-weight="900" fill="#8b1739" font-family="Arial">PASS ID</text><text id="passId" x="512" y="1040" text-anchor="middle" font-size="38" font-weight="900" fill="#8b1739" font-family="Georgia">DN-0001</text><line x1="145" y1="1070" x2="879" y2="1070" stroke="#d6b77f" stroke-width="2"/><text x="210" y="1115" font-size="19" font-weight="900" fill="#8b1739" font-family="Arial">DATE</text><text x="490" y="1115" font-size="19" font-weight="900" fill="#8b1739" font-family="Arial">TIME</text><text x="735" y="1115" font-size="19" font-weight="900" fill="#8b1739" font-family="Arial">VENUE</text><text x="210" y="1150" font-size="19" fill="#351c23" font-family="Arial">October 9, 2026</text><text x="490" y="1150" font-size="19" fill="#351c23" font-family="Arial">5:00 PM onwards</text><text x="735" y="1145" font-size="18" fill="#351c23" font-family="Arial">SR Convention Hall,</text><text x="735" y="1170" font-size="18" fill="#351c23" font-family="Arial">Tadepalli</text><rect x="355" y="1190" width="314" height="60" rx="30" fill="#8b1739"/><text x="512" y="1231" text-anchor="middle" font-size="28" font-weight="900" fill="#fff6dc" font-family="Georgia">₹99 / PERSON</text><text x="512" y="1280" text-anchor="middle" font-size="21" font-weight="700" fill="#7d1233" font-family="Georgia">Please show this pass at the entry counter</text><text x="512" y="1310" text-anchor="middle" font-size="13" fill="#80646a" font-family="Arial">Entry is permitted only for the number of people mentioned above.</text></svg>`;
const $=id=>document.getElementById(id);const nameInput=$("name"),peopleInput=$("people"),passNo=$("passNo"),preview=$("preview");let counter=Number(localStorage.getItem("ruthuragalu_dandiya_counter")||0),current="DN-"+String(Math.max(counter,1)).padStart(4,"0");passNo.value=current;
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function getValues(){const n=(nameInput.value||"").trim()||"YOUR NAME",p=Math.max(1,Math.min(99,parseInt(peopleInput.value)||1));return {n,p}}function buildSvg(){const {n,p}=getValues();let svg=template;svg=svg.replace('id="bookingName" x="300" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">YOUR NAME</text>',`id="bookingName" x="300" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">${esc(n.length>18?n.slice(0,17)+"…":n)}</text>`);svg=svg.replace('id="people" x="735" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">1</text>',`id="people" x="735" y="900" text-anchor="middle" font-size="43" font-weight="700" font-style="italic" fill="#8b1739" font-family="cursive">${p}</text>`);svg=svg.replace('id="passId" x="512" y="1040" text-anchor="middle" font-size="38" font-weight="900" fill="#8b1739" font-family="Georgia">DN-0001</text>',`id="passId" x="512" y="1040" text-anchor="middle" font-size="38" font-weight="900" fill="#8b1739" font-family="Georgia">${current}</text>`);return svg}function refresh(){const svg=buildSvg();preview.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}nameInput.addEventListener("input",refresh);peopleInput.addEventListener("input",refresh);$("generate").onclick=()=>{counter++;localStorage.setItem("ruthuragalu_dandiya_counter",counter);current="DN-"+String(counter).padStart(4,"0");passNo.value=current;refresh()};$("save").onclick=()=>{const svg=buildSvg(),blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=1024;c.height=1536;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,1024,1536);URL.revokeObjectURL(url);c.toBlob(async png=>{const file=new File([png],"Ruthuragalu-Dandiya-"+current+".png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:"Ruthuragalu Dandiya Night Entry Pass",files:[file]});return}catch(e){}}const a=document.createElement("a");a.href=URL.createObjectURL(png);a.download=file.name;a.click()},"image/png")};img.src=url};refresh();
</script></body></html>
