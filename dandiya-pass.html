<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruthuragalu Dandiya Night Pass Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#f4dfcf;font-family:Arial,sans-serif;color:#4a2029}.wrap{max-width:520px;margin:auto;padding:16px}.panel{background:#fff9ef;border:1px solid #d9b875;border-radius:18px;padding:16px;box-shadow:0 12px 30px #5b182c22}h1{text-align:center;margin:0;color:#8b1739;font:900 27px Georgia}p{text-align:center;color:#76515a;font-size:12px;margin:7px 0 14px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input{width:100%;padding:12px;border:1px solid #d6b77f;border-radius:10px;font-size:16px;background:#fffdf8}.row{display:grid;grid-template-columns:1fr 110px;gap:10px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:13px;font-weight:900;font-size:14px}.gen{background:#8b1739;color:white}.share{background:#ead3a4;color:#5a1b2d}.stage{margin-top:18px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 10px 30px #5b182c22}canvas{display:block;width:100%;height:auto;border-radius:8px}.error{display:none;color:#9b1739;background:#ffe7e7;border-radius:10px;padding:10px;margin-top:10px;text-align:center;font-size:12px}</style></head><body><div class="wrap"><div class="panel"><h1>Dandiya Night Pass Generator</h1><p>Enter the booking details and generate the same pass design.</p><label>Booking Person Name</label><input id="name" placeholder="Enter booking name" autocomplete="off"><div class="row"><div><label>No. of People</label><input id="people" type="number" min="1" max="99" value="1"></div><div><label>Pass No.</label><input id="passno" readonly></div></div><button class="gen" id="generate">GENERATE PASS</button><button class="share" id="share">SAVE / SHARE TO WHATSAPP</button><div id="error" class="error">Pass template could not be loaded. Please refresh once.</div><div class="stage"><canvas id="pass" width="512" height="768"></canvas></div></div></div><script>const canvas=document.getElementById('pass'),ctx=canvas.getContext('2d'),img=new Image(),nameEl=document.getElementById('name'),peopleEl=document.getElementById('people'),passNoEl=document.getElementById('passno'),errorEl=document.getElementById('error');let counter=Number(localStorage.getItem('ruth_dn_counter')||0),current='';img.src='dandiya-master.jpg?v=1';function nextId(){counter++;localStorage.setItem('ruth_dn_counter',counter);return 'DN-'+String(counter).padStart(4,'0')}function fitText(t,w,font){ctx.font=font;if(ctx.measureText(t).width<=w)return t;let s=t;while(s.length>1&&ctx.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}function draw(){if(!img.complete||!img.naturalWidth)return;ctx.clearRect(0,0,512,768);ctx.drawImage(img,0,0,512,768);ctx.fillStyle='#8b1739';ctx.textAlign='center';ctx.textBaseline='middle';let name=nameEl.value.trim()||'YOUR NAME';let people=Math.max(1,Math.min(99,Number(peopleEl.value)||1));let pid=current||'DN-0001';ctx.font='bold 18px Georgia';ctx.fillText(fitText(name,190,'bold 18px Georgia'),171,420);ctx.fillText(people+(people===1?' PERSON':' PEOPLE'),342,420);ctx.font='bold 18px Georgia';ctx.fillText(pid,256,505)}img.onload=()=>{errorEl.style.display='none';draw()};img.onerror=()=>{errorEl.style.display='block'};nameEl.oninput=draw;peopleEl.oninput=draw;document.getElementById('generate').onclick=()=>{current=nextId();passNoEl.value=current;draw()};document.getElementById('share').onclick=async()=>{if(!img.complete||!img.naturalWidth){errorEl.style.display='block';return}if(!current){current=nextId();passNoEl.value=current;draw()}await new Promise(r=>setTimeout(r,100));canvas.toBlob(async blob=>{const file=new File([blob],'Ruthuragalu-Dandiya-'+current+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Ruthuragalu Dandiya Night Entry Pass',files:[file]});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};</script></body></html>
