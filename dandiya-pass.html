<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruthuragalu Dandiya Night Pass</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f5e5d5,#f6cfd1);font-family:Arial,sans-serif;color:#4b1d29}.wrap{max-width:520px;margin:auto;padding:16px}.panel{background:#fffaf2;border:2px solid #d4ae61;border-radius:20px;padding:18px;box-shadow:0 10px 30px #5b182c22}h1{text-align:center;margin:0;color:#8d173b;font:900 29px Georgia,serif}.sub{text-align:center;color:#76515a;font-size:13px;margin:7px 0 18px}label{display:block;font-size:15px;font-weight:800;margin:12px 0 6px}input{width:100%;padding:14px;border:2px solid #d8bd87;border-radius:12px;font-size:17px;background:#fffdf8;color:#4b1d29}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:14px;font-weight:900;font-size:16px}.gen{background:#8d173b;color:#fff}.share{background:#ead19e;color:#5a1b2d}.stage{margin-top:20px;background:#fff;border-radius:14px;padding:5px;box-shadow:0 10px 30px #5b182c22}.stage img{display:block;width:100%;height:auto;border-radius:10px}.hint{text-align:center;color:#76515a;font-size:11px;margin:8px 0 0}</style>
</head><body><div class="wrap"><div class="panel"><h1>RUTHURAGALU DANDIYA NIGHT</h1><div class="sub">Enter booking details and generate your entry pass instantly.</div>
<label>Booking Person Name</label><input id="name" placeholder="Enter booking name" autocomplete="off">
<div class="row"><div><label>No. of People</label><input id="people" type="number" min="1" max="99" value="1"></div><div><label>Pass No.</label><input id="passno" readonly placeholder="Auto"></div></div>
<button class="gen" id="generate">GENERATE PASS</button><button class="share" id="share">SAVE / SHARE TO WHATSAPP</button>
<div class="stage"><img id="preview" alt="Dandiya entry pass"></div><div class="hint">The image shared to WhatsApp is the same design shown above.</div></div></div>
<script>
const nameEl=document.getElementById('name'),peopleEl=document.getElementById('people'),passNoEl=document.getElementById('passno'),preview=document.getElementById('preview');let current='',objectUrl='';
function newId(){const now=Date.now();return 'DN-'+String(now).slice(-8)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function makeSvg(){const name=esc(nameEl.value.trim()||'Guest');const p=Math.max(1,Math.min(99,Number(peopleEl.value)||1));const people=p+(p===1?' PERSON':' PEOPLE');const id=esc(current||'DN-'+String(Date.now()).slice(-8));return `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9ef"/><stop offset="1" stop-color="#f7d9d5"/></linearGradient></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect x="18" y="18" width="988" height="1500" rx="12" fill="none" stroke="#c99d49" stroke-width="12"/><rect x="34" y="34" width="956" height="1468" rx="8" fill="none" stroke="#8d173b" stroke-width="2"/><text x="512" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="700" letter-spacing="7" fill="#5a1b2d">RUTHURAGALU</text><text x="512" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#76515a">A TELUGU CULTURAL CLUB</text><rect x="105" y="205" width="814" height="205" rx="8" fill="#8d173b"/><text x="512" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-weight="900" letter-spacing="4" fill="#ffe8a8">DANDIYA</text><text x="512" y="366" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-weight="900" letter-spacing="4" fill="#ffe8a8">NIGHT</text><rect x="282" y="377" width="460" height="74" rx="37" fill="#fff4d8" stroke="#c99d49" stroke-width="6"/><text x="512" y="425" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#5a1b2d">ENTRY PASS</text><rect x="110" y="492" width="804" height="78" rx="18" fill="#9b1739"/><text x="512" y="543" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="900" fill="#fff">BOOKING CONFIRMED</text><rect x="70" y="615" width="884" height="730" rx="28" fill="#fffdf8" stroke="#d9b875" stroke-width="5"/><text x="290" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#76515a">BOOKING NAME</text><text x="734" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#76515a">NO. OF PEOPLE</text><text x="290" y="745" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="900" fill="#8d173b">${name}</text><text x="734" y="745" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="900" fill="#8d173b">${esc(people)}</text><line x1="125" y1="790" x2="899" y2="790" stroke="#d9b875" stroke-width="2"/><text x="512" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900" letter-spacing="2" fill="#76515a">PASS ID</text><text x="512" y="905" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="900" fill="#8d173b">${id}</text><line x1="125" y1="950" x2="899" y2="950" stroke="#d9b875" stroke-width="2"/><text x="200" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="#8d173b">DATE</text><text x="512" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="#8d173b">TIME</text><text x="824" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="#8d173b">VENUE</text><text x="200" y="1060" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3e252b">October 9, 2026</text><text x="512" y="1050" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3e252b">5:00 PM</text><text x="512" y="1078" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3e252b">onwards</text><text x="824" y="1050" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#3e252b">SR Convention Hall,</text><text x="824" y="1078" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#3e252b">Tadepalli</text><rect x="300" y="1130" width="424" height="72" rx="36" fill="#9b1739"/><text x="512" y="1177" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#fff">₹99 / PERSON</text><text x="512" y="1255" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="900" fill="#8d173b">Please show this pass at the entry counter</text><text x="512" y="1295" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#76515a">Entry is permitted only for the number of people mentioned above.</text><text x="512" y="1400" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#8d173b">Dance • Dandiya • Dhoom &amp; More!</text></svg>`}
function render(){const blob=new Blob([makeSvg()],{type:'image/svg+xml'});if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);preview.src=objectUrl}
function generate(){current=newId();passNoEl.value=current;render();preview.scrollIntoView({behavior:'smooth',block:'start'})}
nameEl.oninput=()=>{if(current)render()};peopleEl.oninput=()=>{if(current)render()};document.getElementById('generate').onclick=generate;
document.getElementById('share').onclick=async()=>{if(!current)generate();await new Promise(r=>setTimeout(r,100));const svg=makeSvg(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1024;c.height=1536;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(u);c.toBlob(async blob=>{const file=new File([blob],'Ruthuragalu-Dandiya-'+current+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Ruthuragalu Dandiya Night Entry Pass',files:[file]});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()},'image/png')};img.src=u};
render();
</script></body></html>
