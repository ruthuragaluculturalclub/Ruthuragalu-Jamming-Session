.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:24px 14px 48px}

.soundwave{height:54px;display:flex;justify-content:center;align-items:center;gap:6px;margin:0 auto 12px;color:#a87536}
.soundwave span{display:block;width:6px;border-radius:8px;background:linear-gradient(#b98a4b,#7b8a49);height:22px}
.soundwave span:nth-child(1),.soundwave span:nth-child(7){height:13px}
.soundwave span:nth-child(2),.soundwave span:nth-child(6){height:28px}
.soundwave span:nth-child(3),.soundwave span:nth-child(5){height:39px}
.soundwave span:nth-child(4){height:52px}
.brand-title{font-family:"Noto Serif Telugu","Gautami","Nirmala UI",serif;font-size:clamp(39px,10vw,68px);font-weight:800;line-height:1.28;color:#435b2c;background:linear-gradient(90deg,#355c31 8%,#9b722e 53%,#8b3c1e 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 2px}
.club-label{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 18px;font:12px/1.4 Georgia,serif;letter-spacing:.22em;color:#5b4128}
.club-label span{display:inline-block;width:42px;height:1px;background:#a67c43}
.club-header h1{font:800 clamp(33px,8.2vw,58px)/.98 Georgia,"Times New Roman",serif;letter-spacing:.01em;color:#2e241a;margin:0}
.title-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:17px auto 10px;color:#a87536}
.title-divider span{width:min(25vw,115px);height:1px;background:#b18a54}

.songs-index{font:12px/1.5 system-ui,sans-serif;letter-spacing:.27em;color:#6d5942;margin-bottom:12px}
.club-header .sub{font:15px/1.5 Georgia,serif;color:#6d5135;margin:0 0 14px}
.search{width:100%;margin-top:10px;padding:16px 18px;border:2px solid #e5cba4;border-radius:22px;font:16px system-ui,-apple-system,sans-serif;outline:none;background:#fffaf2;color:var(--ink);box-shadow:0 5px 16px #8c69351a;text-align:left}
.search:focus{border-color:var(--olive2);box-shadow:0 0 0 3px #77815a20}
.song-list{display:grid;gap:12px}
.song-btn{position:relative;overflow:hidden;display:grid;grid-template-columns:58px minmax(0,1fr) 22px;grid-template-rows:auto auto;align-items:center;column-gap:14px;padding:19px 18px;background:#fffaf0ed;border:1px solid #e7d6bd;border-radius:22px;color:var(--ink);text-decoration:none;cursor:pointer;box-shadow:0 6px 20px #76572b15;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.song-btn:hover{transform:translateY(-2px);border-color:#c8b08b;box-shadow:0 9px 24px #76572b20}
.song-btn:active{transform:scale(.995)}
.song-btn:after{content:"›";grid-column:3;grid-row:1/3;align-self:center;color:#a77639;font:40px/1 Georgia,serif}
.num{grid-column:1;grid-row:1/3;display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;margin:0;border-radius:50%;background:linear-gradient(145deg,#bd8a4b,#97672e);color:#fffaf0;font:700 21px system-ui,sans-serif;box-shadow:inset 0 1px #ffffff55}
.song-name{grid-column:2;grid-row:1;font:700 clamp(16px,3.5vw,21px)/1.35 Georgia,"Times New Roman",serif;color:#2f281f}
.movie{grid-column:2;grid-row:2;margin:5px 0 0;color:#766b5c;font:15px/1.4 system-ui,-apple-system,sans-serif}
.empty{color:var(--muted);text-align:center;padding:24px;font:15px system-ui,sans-serif}
.song-view{display:none}
.back{border:1px solid #e5d1ae;background:#fffaf0;padding:10px 15px;margin:0 0 14px;border-radius:12px;font:600 14px system-ui,sans-serif;color:#76552e;cursor:pointer}
.song-card{background:#fffaf0f2;border:1px solid #e7d6bd;border-radius:24px;padding:24px 20px 30px;box-shadow:0 8px 26px #3b3c2410}
.song-card h2{margin:0;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#382a1c}
.song-card .movie-title{margin:8px 0 22px;color:#806342;font:14px system-ui,sans-serif;border-bottom:1px solid #e7d6bd;padding-bottom:16px}
.lyrics p{margin:0 0 14px;font:17px/1.75 Georgia,"Times New Roman",serif;white-space:pre-wrap;color:#3d3d30}
.top{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border:1px solid #e5d1ae;border-radius:50%;background:#fffaf0;color:#76552e;font-size:22px;box-shadow:0 4px 16px #00000018;cursor:pointer;z-index:5}
.music-backdrop{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:.7}
.instrument{position:absolute;filter:drop-shadow(0 12px 10px #77552b12)}
.guitar-art{width:clamp(110px,21vw,230px);height:auto;left:-18px;top:7%;transform:rotate(-7deg);opacity:.64}
.piano-art{width:clamp(190px,32vw,370px);height:auto;right:-90px;top:-30px;opacity:.52}
.note{position:absolute;color:#a77b42;font-family:Georgia,serif;opacity:.45;line-height:1}
.note-one{font-size:76px;right:6%;top:28%}.note-two{font-size:58px;left:4%;top:57%}.note-three{font-size:82px;right:2%;bottom:9%}
.band-stage{position:relative;isolation:isolate;height:180px;margin:0 0 20px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#f5e7cc 0%,#e7d1a9 58%,#8c7049 59%,#6e5637 100%);border:1px solid #d4b98c}
.band-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#fff5cfaa,transparent 62%);z-index:-1}
.band-stage .stage-lights{position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#fff7d355 32%,transparent 46%),linear-gradient(250deg,transparent 48%,#fff7d355 60%,transparent 73%);animation:light-sweep 6s ease-in-out infinite alternate}
.band-member{position:absolute;bottom:24px;width:76px;height:125px;animation:sway 1.7s ease-in-out infinite alternate;transform-origin:50% 100%}
.band-member .head{position:absolute;top:0;left:24px;width:30px;height:34px;border-radius:50%;background:#5d422b;border:3px solid #8e673d}
.band-member .body{position:absolute;top:30px;left:14px;width:50px;height:68px;border-radius:20px 20px 8px 8px;background:#6c744c}
.band-member .arm{position:absolute;top:43px;left:4px;width:65px;height:13px;border-radius:10px;background:#8d6942;transform:rotate(-28deg);transform-origin:90% 50%}
.band-member .instrument{position:absolute;top:66px;left:15px;width:60px;height:28px;border-radius:50%;background:#b7813f;border:3px solid #6b4927;filter:none}
.band-member .instrument:after{content:"";position:absolute;left:28px;top:-45px;width:7px;height:76px;background:#6a4b2e;transform:rotate(-35deg);border-radius:4px}
.band-member.one{left:12%;animation-delay:-.4s}.band-member.two{left:39%;transform:scale(1.12);animation-delay:-1.1s}.band-member.three{right:13%;animation-delay:-.8s}
.band-member.two .body{background:#a66c38}.band-member.three .body{background:#68744d}
.band-member.two .arm{animation:drum .48s ease-in-out infinite alternate;transform-origin:10% 50%}
.band-member.three .instrument{width:75px;height:44px;top:55px;border-radius:10px;background:repeating-linear-gradient(90deg,#8d6a3e 0 8px,#d8b77e 8px 10px)}
.band-note{position:absolute;color:#95672f;font:30px Georgia,serif;animation:float-note 3.2s ease-in-out infinite}.band-note.n1{left:25%;top:18%}.band-note.n2{right:25%;top:13%;animation-delay:-1.3s}.band-note.n3{left:58%;top:35%;animation-delay:-2s}
.band-stage .stage-label{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#fff5dc;font:10px/1.3 system-ui,sans-serif;letter-spacing:.22em;text-shadow:0 1px 3px #3d2c18}

@keyframes drum{from{rotate:-35deg}to{rotate:35deg}}
@keyframes float-note{0%,100%{transform:translateY(8px) rotate(-8deg);opacity:.35}50%{transform:translateY(-12px) rotate(8deg);opacity:.9}}
@keyframes light-sweep{from{transform:translateX(-12%)}to{transform:translateX(12%)}}

const list = document.getElementById("songList");
const search = document.getElementById("search");
const home = document.getElementById("home");
const view = document.getElementById("songView");

function renderList(filter="") {
  const q = filter.trim().toLowerCase();
  const matches = songs.filter(s =>
    !q || (s.title + " " + s.movie).toLowerCase().includes(q)
  );
  list.innerHTML = "";
  if (!matches.length) {
    list.innerHTML = '<div class="empty">No song found.</div>';
    return;
  }
  matches.forEach(s => {
    const a = document.createElement("a");
    a.className = "song-btn";
    a.href = "#song-" + s.no;
    a.innerHTML = '<span class="num">' + s.no + '</span><span class="song-name">' +
      escapeHtml(s.title) + '</span><div class="movie">' + escapeHtml(s.movie) + '</div>';
    a.onclick = (e) => {
      e.preventDefault();
      showSong(s.no);
    };
    list.appendChild(a);
  });
}

function showSong(no) {
  const s = songs.find(x => x.no === no);
  if (!s) return;
  document.getElementById("viewTitle").textContent = s.no + ". " + s.title;
  document.getElementById("viewMovie").textContent = s.movie;
  const lyrics = document.getElementById("lyrics");
  lyrics.innerHTML = "";
  s.lyrics.forEach(line => {
    const p = document.createElement("p");
    p.textContent = line;
    lyrics.appendChild(p);
  });
  home.style.display = "none";
  view.style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
  history.replaceState(null, "", "#song-" + s.no);
}

function showHome() {
  view.style.display = "none";
  home.style.display = "block";
  history.replaceState(null, "", "#songs");
  window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

search.addEventListener("input", e => renderList(e.target.value));

renderList();

if (location.hash.startsWith("#song-")) {
  showSong(location.hash.replace("#song-",""));
}
